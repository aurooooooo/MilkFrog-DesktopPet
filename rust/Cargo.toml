[package]
name = "milkfrog"
version = "0.4.1"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "MilkFrog native Windows desktop pet"

[dependencies]
tiny-skia = "=0.11.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "=0.58.0", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Com", "Win32_Storage_FileSystem",
  "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media_MediaFoundation"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
