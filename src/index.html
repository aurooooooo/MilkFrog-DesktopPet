<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MilkFrog 奶蛙桌宠</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="stage" class="stage">
    <section id="pet" class="pet">
      <img id="sceneFallback" class="layer" src="../assets/runtime/preview.webp" alt="" draggable="false" />
      <canvas id="scene" class="layer" role="img" aria-label="奶蛙操作朝向自己的七键键盘和鼠标"></canvas>
      <video id="laughVideo" class="layer" preload="none" playsinline hidden aria-label="奶蛙捧腹大笑"></video>
    </section>

    <p id="petStatus" class="pet-status" role="status" hidden></p>
  </main>
  <script src="./input-state.js"></script>
  <script src="./rig.js"></script>
  <script src="./pet-media.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
